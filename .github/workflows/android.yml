name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and find Gradle project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_src"
          find . -name '*.zip' -not -path './.git/*' -not -path './_src/*' | while read -r z; do
            echo "Unzipping $z"
            unzip -oq "$z" -d "$GITHUB_WORKSPACE/_src" -x '__MACOSX/*'
          done
          F=$(find "$GITHUB_WORKSPACE" -name settings.gradle.kts -not -path '*/.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Repo contents:"
            find "$GITHUB_WORKSPACE" -not -path '*/.git/*' | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Project found at $(dirname "$F")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PlateHunter-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
